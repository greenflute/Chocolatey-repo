name: Bump package versions

# Keeps the Chocolatey packages in this repository in step with their upstream
# releases.  Chocolatey has no self-update mechanism for a package definition, so
# without this the versions here only change by hand.
#
# Why 03:17 UTC and not 03:00: GitHub documents that scheduled runs are delayed
# when the platform is busy, and that "high load times include the start of every
# hour".  An off-the-hour minute lowers the chance of a delayed or dropped run.
#
# Caveat: GitHub automatically disables scheduled workflows in a public
# repository after 60 days without repository activity.  Every successful bump is
# a commit, which counts as activity; if the repository ever goes quiet for two
# months, re-enable the workflow from the Actions tab or run it manually.
#
# Only the version check runs daily.  Artifacts are downloaded (and the checksums
# therefore recomputed from the real bytes) only when a version actually changed.
# aardio is the exception: it republishes one unversioned URL in place, so its
# ~7 MB artifact is fetched every run -- that check is the only way to tell
# whether the checksum is still good.
#
# This workflow only rewrites the package definitions; it does not `choco pack` or
# push to the Chocolatey community feed, which stays a separate deliberate step.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-packages
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync manifests with upstream
        id: bump
        run: python3 .github/scripts/bump.py

      - name: Commit tokscos-work bump
        if: steps.bump.outputs.work_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tokscos-work/tokcos-work.nuspec tokscos-work/tools/chocolateyinstall.ps1
          git commit -m "Update tokscos-work to ${{ steps.bump.outputs.work_version }}"

      - name: Commit tokscos-cli bump
        if: steps.bump.outputs.cli_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tokscos-cli/tokcos-cli.nuspec tokscos-cli/tools/chocolateyinstall.ps1
          git commit -m "Update tokscos-cli to ${{ steps.bump.outputs.cli_version }}"

      - name: Commit aardio bump
        if: steps.bump.outputs.aardio_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aardio/aardio.nuspec aardio/tools/chocolateyinstall.ps1
          git commit -m "${{ steps.bump.outputs.aardio_subject }}"

      - name: Push
        if: steps.bump.outputs.changed == 'true'
        run: git push
